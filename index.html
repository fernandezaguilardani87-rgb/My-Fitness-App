<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protocolo Dani</title>
<style>
  :root{
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg:#0F1E30;
    --card:#152840;
    --card2:#1B3049;
    --accent:#4FA8E8;
    --accent2:#2E6FA8;
    --text:#E8F0F8;
    --dim:#8FA8C4;
    --border:#233B58;
    --ok:#5FC98D;
    --warn:#E8B04F;
    --bad:#E86B6B;
  }
  *,*::before,*::after{box-sizing:inherit;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.5;padding-bottom:50px;
  }
  header{
    padding:18px 16px 12px;border-bottom:1px solid var(--border);
    position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20;
  }
  h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-0.3px;}
  .sub{color:var(--dim);font-size:12.5px;margin-top:3px;}
  nav{
    display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;
    background:var(--bg);position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:19;
    border-bottom:1px solid var(--border);padding-bottom:10px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  nav::-webkit-scrollbar{display:none;}
  nav button{
    flex:0 0 auto;background:var(--card);border:1px solid var(--border);color:var(--dim);
    padding:8px 13px;border-radius:9px;font-size:12.5px;font-weight:600;
    white-space:nowrap;cursor:pointer;font-family:inherit;
  }
  nav button.on{background:var(--accent2);border-color:var(--accent);color:#fff;}
  main{padding:16px;max-width:820px;margin:0 auto;}
  section{display:none;}
  section.on{display:block;}
  h2{font-size:16px;margin:0 0 3px;font-weight:700;}
  h3{font-size:13px;margin:22px 0 9px;font-weight:700;text-transform:uppercase;
     letter-spacing:.6px;color:var(--dim);}
  .lead{color:var(--accent);font-size:12.5px;font-weight:600;margin-bottom:14px;}
  .bar{height:5px;background:var(--card);border-radius:3px;overflow:hidden;margin:0 0 14px;}
  .bar div{height:100%;background:var(--accent);width:0;transition:width .3s;}
  .item{
    background:var(--card);border:1px solid var(--border);border-radius:11px;
    padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;
  }
  .item .txt{flex:1;min-width:0;}
  .item .nm{font-size:14.5px;font-weight:600;}
  .item .dt{color:var(--dim);font-size:12.5px;margin-top:2px;}
  .item .hint{color:var(--dim);font-size:11.5px;margin-top:5px;font-style:italic;line-height:1.45;}
  .chk{
    width:24px;height:24px;flex:0 0 24px;border-radius:7px;border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:1px;
    background:transparent;padding:0;
  }
  .chk.done{background:var(--ok);border-color:var(--ok);}
  .chk.done::after{content:"✓";color:#0F1E30;font-size:14px;font-weight:900;line-height:1;}
  .wr{display:flex;align-items:center;gap:9px;margin-top:10px;padding-top:10px;
      border-top:1px solid var(--border);flex-wrap:wrap;}
  .wr label{font-size:11.5px;color:var(--dim);}
  .wr input{
    background:var(--card2);border:1px solid var(--border);color:var(--text);
    border-radius:7px;padding:6px 9px;font-size:13.5px;width:84px;font-family:inherit;
  }
  .wr .ref{font-size:11px;color:var(--dim);font-style:italic;}
  .note{
    background:var(--card2);border:1px solid var(--accent2);border-radius:11px;
    padding:13px 15px;font-size:13px;color:var(--dim);line-height:1.55;margin:14px 0;
  }
  .note b{color:var(--text);}
  .note.warn{border-color:var(--warn);}
  .note.bad{border-color:var(--bad);}
  .tag{
    display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;
    border-radius:20px;margin-bottom:8px;letter-spacing:.3px;
  }
  .tag.pre{background:var(--accent2);color:#fff;}
  .tag.post{background:#3A5470;color:#fff;}
  .tag.any{background:#2C4159;color:var(--dim);}
  p{margin:0 0 11px;font-size:13.5px;color:var(--dim);line-height:1.6;}
  p b, li b{color:var(--text);}
  ul{margin:0 0 13px;padding-left:19px;}
  li{font-size:13.5px;color:var(--dim);margin-bottom:6px;line-height:1.55;}
  .phase-sel{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .phase-sel button{
    background:var(--card);border:1px solid var(--border);color:var(--dim);
    padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;
    cursor:pointer;font-family:inherit;
  }
  .phase-sel button.on{background:var(--accent2);border-color:var(--accent);color:#fff;}
  .btn{
    width:100%;background:transparent;border:1px solid var(--border);color:var(--dim);
    padding:11px;border-radius:9px;font-size:12.5px;margin-top:18px;cursor:pointer;
    font-family:inherit;
  }
  .day-card{
    background:var(--card);border:1px solid var(--border);border-radius:11px;
    padding:14px;margin-bottom:10px;
  }
  .day-card h4{margin:0 0 4px;font-size:14.5px;font-weight:700;}
  .day-card p{margin:0;font-size:12.5px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:14px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);}
  th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
  .scroll{overflow-x:auto;}
</style>
</head>
<body>

<header>
  <h1>Protocolo integral</h1>
  <div class="sub" id="today"></div>
</header>

<nav id="nav"></nav>

<main>
  <section id="s-hoy"></section>
  <section id="s-entreno"></section>
  <section id="s-cuello"></section>
  <section id="s-pelvico"></section>
  <section id="s-mio"></section>
  <section id="s-movilidad"></section>
  <section id="s-guia"></section>
</main>

<script>
"use strict";

/* ---------- utilidades ---------- */
function dayKey(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function load(k){
  try{
    var raw = localStorage.getItem(k);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function save(k,v){
  try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
}
function getState(){ return load("proto_" + dayKey()); }
function setState(s){ save("proto_" + dayKey(), s); }
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ---------- render de items ---------- */
var uid = 0;
function itemHTML(ex, key, withWeight){
  var st = getState();
  var done = !!st[key];
  var val = st["w_"+key] || "";
  var h = '<div class="item">';
  h += '<div class="txt">';
  h += '<div class="nm">' + esc(ex.n) + '</div>';
  if(ex.d) h += '<div class="dt">' + esc(ex.d) + '</div>';
  if(ex.h) h += '<div class="hint">' + esc(ex.h) + '</div>';
  if(withWeight){
    h += '<div class="wr"><label>Peso</label>';
    h += '<input type="text" inputmode="decimal" placeholder="kg" value="' + esc(val) + '" data-w="' + key + '">';
    if(ex.r) h += '<span class="ref">' + esc(ex.r) + '</span>';
    h += '</div>';
  }
  h += '</div>';
  h += '<button class="chk' + (done ? ' done' : '') + '" data-c="' + key + '" aria-label="Marcar"></button>';
  h += '</div>';
  return h;
}
function listHTML(arr, prefix, withWeight){
  var h = "";
  for(var i=0;i<arr.length;i++){
    h += itemHTML(arr[i], prefix + "_" + i, withWeight && arr[i].w === 1);
  }
  return h;
}
function progressHTML(prefix, count){
  var st = getState(), n = 0;
  for(var i=0;i<count;i++){ if(st[prefix+"_"+i]) n++; }
  var pct = count ? (n/count*100) : 0;
  return '<div class="bar"><div style="width:' + pct + '%"></div></div>';
}

/* ---------- secciones ---------- */
var trainSel = "upper1";
var mioSel = 1;
var pelvSel = 1;

function renderHoy(){
  var h = '<h2>Hoy</h2><div class="lead">Cómo encaja todo en el día</div>';

  h += '<div class="note"><b>No arranques todo a la vez.</b> Orden recomendado: primero cuello (ya rodado), luego suelo pélvico, luego miofuncional al terminar el antibiótico, y movilidad al volver al gimnasio con normalidad. Cinco protocolos el mismo día se abandonan en dos semanas.</div>';

  h += '<h3>Día de Upper</h3>';
  h += '<div class="day-card"><h4>Antes de entrenar · 4 min</h4><p>Cuello, bloque de activación: chin tucks y retracción escapular. Mejora la posición escapular en press y remo.</p></div>';
  h += '<div class="day-card"><h4>Después · 15 min</h4><p>Cuello, bloque de estiramiento. Movilidad torácica y de cadera.</p></div>';
  h += '<div class="day-card"><h4>Noche</h4><p>Suelo pélvico, tanda 2.</p></div>';

  h += '<h3>Día de piernas</h3>';
  h += '<div class="day-card"><h4>Antes</h4><p>Nada de estiramiento estático. Calentamiento dinámico normal. Tampoco suelo pélvico intenso: llegarías al peso muerto con el suelo pélvico prefatigado.</p></div>';
  h += '<div class="day-card"><h4>Después · 20 min</h4><p>Movilidad de isquios con PNF y cadera. Músculo caliente: el mejor momento de la semana para ganar rango.</p></div>';
  h += '<div class="day-card"><h4>Noche</h4><p>Suelo pélvico, las dos tandas si no las hiciste por la mañana.</p></div>';

  h += '<h3>Días sin gimnasio</h3>';

/* ---------- navegación ---------- */
var TABS = [
  {id:"hoy", label:"Hoy", fn:renderHoy},
  {id:"entreno", label:"Entreno", fn:renderEntreno},
  {id:"cuello", label:"Cuello", fn:renderCuello},
  {id:"pelvico", label:"Suelo pélvico", fn:renderPelvico},
  {id:"mio", label:"Miofuncional", fn:renderMio},
  {id:"movilidad", label:"Movilidad", fn:renderMovilidad},
  {id:"guia", label:"Guía", fn:renderGuia}
];
var current = "hoy";

function renderNav(){
  var n = document.getElementById("nav");
  var h = "";
  for(var i=0;i<TABS.length;i++){
    h += '<button data-tab="' + TABS[i].id + '" class="' + (TABS[i].id===current?'on':'') + '">' + esc(TABS[i].label) + '</button>';
  }
  n.innerHTML = h;
}

function render(){
  renderNav();
  for(var i=0;i<TABS.length;i++){
    var el = document.getElementById("s-" + TABS[i].id);
    if(!el) continue;
    if(TABS[i].id === current){
      el.innerHTML = TABS[i].fn();
      el.className = "on";
    }else{
      el.className = "";
      el.innerHTML = "";
    }
  }
}

function renderHeader(){
  var days = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  var months = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  var d = new Date();
  document.getElementById("today").textContent =
    days[d.getDay()] + ", " + d.getDate() + " de " + months[d.getMonth()];
}

/* ---------- eventos ---------- */
document.addEventListener("click", function(ev){
  var t = ev.target;
  if(!t || !t.getAttribute) return;

  var tab = t.getAttribute("data-tab");
  if(tab){ current = tab; render(); window.scrollTo(0,0); return; }

  var tr = t.getAttribute("data-train");
  if(tr){ trainSel = tr; render(); return; }

  var mi = t.getAttribute("data-mio");
  if(mi){ mioSel = parseInt(mi,10); render(); return; }

  var pv = t.getAttribute("data-pelv");
  if(pv){ pelvSel = parseInt(pv,10); render(); return; }

  var c = t.getAttribute("data-c");
  if(c){
    var st = getState();
    st[c] = !st[c];
    setState(st);
    render();
    return;
  }

  if(t.getAttribute("data-reset")){
    if(window.confirm("¿Reiniciar todas las marcas de hoy?")){
      setState({});
      render();
    }
    return;
  }
});

document.addEventListener("change", function(ev){
  var t = ev.target;
  if(!t || !t.getAttribute) return;
  var w = t.getAttribute("data-w");
  if(w){
    var st = getState();
    st["w_"+w] = t.value;
    setState(st);
  }
});

renderHeader();
render();
</script>
