<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi día</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0E1B2B; --bg2:#122336;
  --card:#16283D; --card2:#1C3149; --line:#24405E;
  --tx:#EAF2FA; --dim:#8FA8C4; --dim2:#6B839E;
  --fuerza:#4FA8E8; --movil:#5FC98D; --aire:#A98FE8; --pelvi:#E8B04F; --reg:#57C4CE;
  --bad:#E86B6B;
  --r:14px;
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.5;padding-bottom:78px;overscroll-behavior-y:contain;
}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}

/* ---------- cabecera ---------- */
header{padding:16px 18px 12px;background:var(--bg);position:sticky;
  top:env(safe-area-inset-top,0px);z-index:30;border-bottom:1px solid var(--line);}
.htop{display:flex;align-items:center;gap:14px;}
.hinfo{flex:1;min-width:0;}
.hday{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1.15;}
.hsub{font-size:13px;color:var(--dim);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ring{width:54px;height:54px;flex:0 0 54px;position:relative;}
.ring svg{transform:rotate(-90deg);}
.ring .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;}
.dsel{display:flex;gap:5px;margin-top:13px;}
.dsel button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--dim2);
  padding:11px 0;border-radius:10px;font-size:13px;font-weight:800;min-height:44px;}
.dsel button.on{background:var(--fuerza);border-color:var(--fuerza);color:#08131F;}
.dsel button.hoy{border-color:var(--fuerza);color:var(--tx);}

/* ---------- navegación inferior ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:var(--bg2);border-top:1px solid var(--line);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px));}
.tabs button{flex:1;background:none;border:0;color:var(--dim2);font-size:10.5px;
  font-weight:700;padding:6px 2px;min-height:48px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;border-radius:10px;}
.tabs button.on{color:var(--fuerza);background:rgba(79,168,232,.10);}
.tabs .ic{font-size:19px;line-height:1;}

main{padding:16px 16px 10px;max-width:860px;margin:0 auto;}

/* ---------- bloques ---------- */
.blk{margin-bottom:10px;border-radius:var(--r);overflow:hidden;
  background:var(--card);border:1px solid var(--line);}
.blk.now{border-color:var(--fuerza);box-shadow:0 0 0 1px rgba(79,168,232,.25);}
.bh{display:flex;align-items:center;gap:11px;padding:14px 15px;background:none;
  border:0;width:100%;text-align:left;color:var(--tx);min-height:56px;}
.bh .dot{width:9px;height:9px;flex:0 0 9px;border-radius:50%;}
.bh .bt{flex:1;min-width:0;}
.bh .bn{font-size:15.5px;font-weight:700;line-height:1.2;}
.bh .bm{font-size:11.5px;color:var(--dim2);margin-top:2px;}
.bh .bc{font-size:12px;font-weight:800;color:var(--dim);white-space:nowrap;}
.bh .ar{font-size:12px;color:var(--dim2);transition:transform .2s;}
.bh[aria-expanded="true"] .ar{transform:rotate(90deg);}
.bb{padding:0 12px 12px;}
.bnote{font-size:12.5px;color:var(--dim);line-height:1.5;padding:0 3px 11px;}

/* ---------- ítems ---------- */
.it{display:flex;gap:12px;align-items:flex-start;padding:11px 10px;border-radius:11px;
  background:var(--bg2);margin-bottom:6px;border:1px solid transparent;}
.it.ok{opacity:.42;}
.it.ok .nm{text-decoration:line-through;}
.it.ok .hint,.it.ok .meta{display:none;}
.it .tx{flex:1;min-width:0;}
.nm{font-size:16px;font-weight:600;line-height:1.3;}
.sch{font-size:14px;font-weight:700;margin-top:3px;}
.meta{font-size:12px;color:var(--dim);margin-top:4px;}
.hint{font-size:12.5px;color:var(--dim2);margin-top:6px;line-height:1.5;}
.chk{width:30px;height:30px;flex:0 0 30px;border-radius:9px;border:2px solid var(--line);
  background:transparent;display:flex;align-items:center;justify-content:center;
  margin:-3px -2px 0 0;padding:0;position:relative;}
.chk::before{content:"";position:absolute;inset:-8px;}
.chk[aria-pressed="true"]{background:var(--movil);border-color:var(--movil);}
.chk[aria-pressed="true"]::after{content:"✓";color:#08131F;font-size:16px;font-weight:900;line-height:1;}

/* ---------- botón primario ---------- */
.cta{display:block;width:100%;border:0;border-radius:var(--r);padding:17px;
  font-size:16px;font-weight:800;color:#08131F;margin-bottom:14px;min-height:56px;}
.cta.f{background:var(--fuerza);}
.cta.g{background:var(--movil);}
.ghost{display:block;width:100%;background:transparent;border:1px solid var(--line);
  color:var(--dim);border-radius:12px;padding:13px;font-size:13px;margin-top:10px;min-height:48px;}

/* ---------- registro rápido ---------- */
.quick{display:flex;gap:9px;margin-bottom:14px;}
.qcard{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;text-align:center;min-height:82px;display:flex;flex-direction:column;
  justify-content:center;color:var(--tx);}
.qcard .ql{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim2);font-weight:700;}
.qcard .qv{font-size:22px;font-weight:800;margin-top:3px;line-height:1.1;}
.qcard .qv.empty{color:var(--dim2);font-size:15px;font-weight:600;}
.qcard .qu{font-size:11px;color:var(--dim2);}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(6,12,20,.86);z-index:60;display:flex;
  align-items:flex-end;justify-content:center;}
.sheet{background:var(--bg2);border-top-left-radius:20px;border-top-right-radius:20px;
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);}
.sheet h3{margin:0 0 4px;font-size:19px;font-weight:800;}
.sheet .sd{font-size:13px;color:var(--dim);margin-bottom:16px;}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.row button{flex:1 0 auto;min-width:46px;background:var(--card);border:1px solid var(--line);
  color:var(--dim);border-radius:10px;padding:13px 8px;font-size:15px;font-weight:700;min-height:48px;}
.row button.on{background:var(--fuerza);border-color:var(--fuerza);color:#08131F;}
.fld{margin-bottom:14px;}
.fld label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--dim2);font-weight:700;margin-bottom:7px;}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bg);border:1px solid var(--line);
  color:var(--tx);border-radius:11px;padding:14px;font-size:17px;min-height:50px;}
.fld textarea{min-height:76px;font-size:15px;resize:vertical;}

/* ---------- modo sesión ---------- */
.sess{position:fixed;inset:0;background:var(--bg);z-index:70;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.sbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);}
.sbar .x{background:none;border:0;color:var(--dim);font-size:24px;padding:4px 10px;min-height:44px;}
.sprog{flex:1;height:5px;background:var(--card);border-radius:3px;overflow:hidden;}
.sprog div{height:100%;background:var(--fuerza);transition:width .3s;}
.sbar .sc{font-size:12.5px;color:var(--dim);font-weight:700;white-space:nowrap;}
.sbody{flex:1;overflow-y:auto;padding:22px 18px;}
.sex{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.6px;}
.ssch{font-size:17px;font-weight:700;margin-top:6px;}
.slast{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;margin-top:18px;font-size:13.5px;color:var(--dim);}
.slast b{color:var(--tx);}
.slast .sug{color:var(--movil);font-weight:700;}
.sets{display:flex;gap:8px;margin:20px 0 6px;flex-wrap:wrap;}
.sets button{width:52px;height:52px;border-radius:13px;background:var(--card);
  border:2px solid var(--line);color:var(--dim2);font-size:16px;font-weight:800;}
.sets button.on{background:var(--fuerza);border-color:var(--fuerza);color:#08131F;}
.sfoot{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;background:var(--bg2);}
.sfoot button{flex:1;border-radius:13px;padding:16px;font-size:15px;font-weight:800;min-height:56px;border:0;}
.sfoot .prev{background:var(--card);color:var(--dim);flex:0 0 68px;}
.sfoot .next{background:var(--fuerza);color:#08131F;}
.timer{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));
  background:var(--card2);border:1px solid var(--fuerza);border-radius:14px;
  padding:14px 17px;display:flex;align-items:center;gap:14px;z-index:75;}
.timer .tv{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;min-width:74px;}
.timer .tl{flex:1;font-size:12.5px;color:var(--dim);}
.timer button{background:none;border:1px solid var(--line);color:var(--dim);
  border-radius:9px;padding:9px 13px;font-size:12px;min-height:40px;}

/* ---------- gráficas y progreso ---------- */
.chart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;margin-bottom:12px;}
.chart h4{margin:0 0 3px;font-size:14.5px;font-weight:700;}
.chart .cs{font-size:12px;color:var(--dim2);margin-bottom:12px;}
.chart svg{width:100%;height:auto;display:block;}
.chart .empty{color:var(--dim2);font-size:13px;padding:22px 0;text-align:center;}
.grid30{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:6px;}
.grid30 div{aspect-ratio:1;border-radius:4px;background:var(--bg2);border:1px solid var(--line);}
.stats{display:flex;gap:9px;margin-bottom:12px;}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 10px;text-align:center;}
.stat .sv{font-size:25px;font-weight:800;line-height:1.1;}
.stat .sl{font-size:10.5px;color:var(--dim2);text-transform:uppercase;
  letter-spacing:.5px;font-weight:700;margin-top:4px;}

/* ---------- varios ---------- */
h2{font-size:20px;font-weight:800;margin:0 0 3px;letter-spacing:-.4px;}
.lead{font-size:13px;color:var(--dim);margin-bottom:18px;}
h3{font-size:12px;margin:24px 0 10px;font-weight:800;text-transform:uppercase;
  letter-spacing:.8px;color:var(--dim2);}
.note{background:var(--card2);border-left:3px solid var(--fuerza);border-radius:10px;
  padding:13px 15px;font-size:13px;color:var(--dim);line-height:1.6;margin:12px 0;}
.note b{color:var(--tx);}
.note.bad{border-left-color:var(--bad);}
.note.warn{border-left-color:var(--pelvi);}
.cfgrow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:9px;}
.cfgrow .ct{font-size:15px;font-weight:700;margin-bottom:3px;}
.cfgrow .cd{font-size:12px;color:var(--dim2);margin-bottom:11px;line-height:1.45;}
.seg{display:flex;gap:6px;}
.seg button{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--dim2);
  border-radius:9px;padding:11px 4px;font-size:12.5px;font-weight:700;min-height:44px;}
.seg button.on{background:var(--fuerza);border-color:var(--fuerza);color:#08131F;}
.toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));
  background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:14px 16px;
  display:flex;align-items:center;gap:12px;z-index:80;font-size:13.5px;}
.toast button{background:none;border:0;color:var(--fuerza);font-weight:800;font-size:13.5px;
  padding:6px 4px;min-height:40px;}
.done-all{background:linear-gradient(135deg,rgba(95,201,141,.16),rgba(95,201,141,.05));
  border:1px solid var(--movil);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:14px;}
.done-all .t{font-size:17px;font-weight:800;color:var(--movil);}
.done-all .s{font-size:13px;color:var(--dim);margin-top:5px;}
ul{margin:0 0 12px;padding-left:19px;}
li{font-size:13.5px;color:var(--dim);margin-bottom:7px;line-height:1.55;}
li b{color:var(--tx);}
p{font-size:13.5px;color:var(--dim);line-height:1.6;margin:0 0 12px;}
p b{color:var(--tx);}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
</style>
</head>
<body>

<header>
  <div class="htop">
    <div class="hinfo">
      <div class="hday" id="hday">—</div>
      <div class="hsub" id="hsub">—</div>
    </div>
    <div class="ring" id="ring"></div>
  </div>
  <div class="dsel" id="dsel"></div>
</header>

<main id="main"></main>

<nav class="tabs" id="tabs"></nav>

<div id="layer"></div>

<script>
"use strict";

/* ============================================================
   1. ALMACENAMIENTO
   ============================================================ */
function pad(n){ return (n<10?"0":"")+n; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function today(){ return iso(new Date()); }
function todayIdx(){ var d=new Date().getDay(); return d===0?6:d-1; }
function dateOfIdx(i){ var d=new Date(); d.setDate(d.getDate()+(i-todayIdx())); return d; }
function rd(k,f){ try{var r=localStorage.getItem(k);return r?JSON.parse(r):f;}catch(e){return f;} }
function wr(k,v){ try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;} }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function daysBetween(a,b){
  var d1=new Date(a+"T00:00:00"), d2=new Date(b+"T00:00:00");
  return Math.floor((d2-d1)/86400000);
}

var DEF_CFG = {
  cuello:1, pelv:1, mio:0, mov:1,
  pelvStart:null, mioStart:null, autoPhase:1,
  plan:["upperA","lowerA","upperB","lowerB","upperC","off","off"]
};
function cfg(){ var c=rd("cfg",null); if(!c) return JSON.parse(JSON.stringify(DEF_CFG));
  for(var k in DEF_CFG) if(!(k in c)) c[k]=DEF_CFG[k];
  return c; }
function setCfg(c){ wr("cfg",c); }

function dayState(dk){ return rd("d_"+dk,{}); }
function setDayState(dk,s){ wr("d_"+dk,s); }

function metrics(){ return rd("metrics",{}); }
function setMetric(dk,field,val){
  var m=metrics(); if(!m[dk]) m[dk]={}; 
  if(val===null||val==="") delete m[dk][field]; else m[dk][field]=val;
  wr("metrics",m);
}
function exLog(id){ return rd("ex_"+id,[]); }
function pushExLog(id,entry){
  var l=exLog(id);
  l=l.filter(function(e){ return e.d!==entry.d; });
  l.push(entry); l.sort(function(a,b){ return a.d<b.d?-1:1; });
  if(l.length>60) l=l.slice(-60);
  wr("ex_"+id,l);
}
function painLog(){ return rd("pain",[]); }
function addPain(p){ var l=painLog(); l.push(p); if(l.length>120) l=l.slice(-120); wr("pain",l); }

/* fases automáticas a partir de la fecha de inicio */
function phaseOf(which){
  var c=cfg();
  var manual = which==="pelv" ? c.pelv : c.mio;
  if(!manual) return 0;
  if(!c.autoPhase) return manual;
  var start = which==="pelv" ? c.pelvStart : c.mioStart;
  if(!start) return manual;
  var n = daysBetween(start, today());
  if(n<0) return 1;
  if(which==="pelv") return n<14?1:(n<42?2:3);       /* 2 sem / 6 sem */
  return n<30?1:(n<60?2:3);                           /* meses */
}

/* ============================================================
   2. CONTENIDO
   ============================================================ */
var DOM = {
  fuerza:{c:"var(--fuerza)",n:"Fuerza"},
  movil:{c:"var(--movil)",n:"Movilidad"},
  aire:{c:"var(--aire)",n:"Vía aérea"},
  pelvi:{c:"var(--pelvi)",n:"Suelo pélvico"},
  reg:{c:"var(--reg)",n:"Registro"}
};

/* calentamientos específicos */
var WARM = {
  upper:[
    {id:"w_band",n:"Rotación externa con banda",s:"2×15 por lado",
     h:"Codo pegado al costado. Prepara el manguito rotador antes de cualquier press."},
    {id:"w_scap",n:"Dislocaciones con palo o banda",s:"2×12",
     h:"Agarre ancho, movimiento lento. Abre el hombro sin forzar."},
    {id:"w_pushup",n:"Flexiones escapulares",s:"2×12",
     h:"En plancha, solo junta y separa los omóplatos sin doblar los codos."},
    {id:"w_serie",n:"Serie de aproximación del primer ejercicio",s:"2 series ligeras",
     h:"50% y 70% del peso de trabajo. No cuenta como serie efectiva."}
  ],
  piernas:[
    {id:"w_bike",n:"Bicicleta suave",s:"5 min",t:300,
     h:"Solo para subir temperatura, sin intensidad."},
    {id:"w_ankle",n:"Movilidad de tobillo contra pared",s:"2×10 por lado",
     h:"Rodilla sobrepasando la punta del pie sin despegar el talón. Condiciona la profundidad de sentadilla."},
    {id:"w_hip90",n:"90/90 dinámico",s:"10 rotaciones por lado"},
    {id:"w_glute",n:"Puente de glúteo",s:"2×15",
     h:"Activación previa. Un glúteo dormido hace que el cuádriceps y la rodilla asuman de más."},
    {id:"w_sq",n:"Series de aproximación de sentadilla",s:"3 series",
     h:"Barra vacía, 50% y 75%. Con la rodilla izquierda en observación, esto no es opcional."}
  ]
};

var ENT = {
  upperA:{t:"Upper A",sub:"Fuerza y empuje",mins:70,warm:"upper",ex:[
    {id:"press_banca",n:"Press banca plano",s:"4×6-8",sets:4,w:1,tipo:"comp"},
    {id:"press_mil_barra",n:"Press militar con barra",s:"4×6-8",sets:4,w:1,tipo:"comp"},
    {id:"press_incl_manc",n:"Press inclinado mancuernas",s:"3×8-10",sets:3,w:1,tipo:"comp"},
    {id:"lat_manc_A",n:"Elevaciones laterales mancuernas",s:"4×15-20",sets:4,w:1,tipo:"ais"},
    {id:"lat_polea_A",n:"Elevaciones laterales polea baja",s:"3×15-20",sets:3,w:1,tipo:"ais"},
    {id:"tri_cuerda",n:"Tríceps polea con cuerda",s:"3×15-20",sets:3,w:1,tipo:"ais"},
    {id:"tri_cabeza",n:"Tríceps sobre cabeza",s:"3×12-15",sets:3,w:1,tipo:"ais"},
    {id:"face_pulls_A",n:"Face pulls",s:"4×15-20",sets:4,w:0,tipo:"ais",
     h:"Obligatorios en los tres días de Upper. Son deltoides posterior y postura cervical a la vez."}
  ]},
  lowerA:{t:"Lower A",sub:"Cuádriceps",mins:70,warm:"piernas",ex:[
    {id:"sentadilla",n:"Sentadilla con barra",s:"4×6-8",sets:4,w:1,tipo:"comp",r:"100 kg",
     h:"Rodilla izquierda en observación. Si aparece molestia rotuliana baja carga; si persiste a 90 kg, registra la molestia y pasa al resto de la sesión."},
    {id:"prensa",n:"Prensa",s:"3×12-15",sets:3,w:1,tipo:"comp"},
    {id:"ext_cuad",n:"Extensión de cuádriceps",s:"3×15-20",sets:3,w:1,tipo:"ais"},
    {id:"curl_fem_tumb",n:"Curl femoral tumbado",s:"4×15-20",sets:4,w:1,tipo:"ais"},
    {id:"talones_pie",n:"Elevación de talones de pie",s:"3×20",sets:3,w:1,tipo:"ais"},
    {id:"crunch_peso",n:"Core · crunch con peso",s:"3×15",sets:3,w:1,tipo:"ais"},
    {id:"crunch_lat",n:"Core · crunch lateral con mancuerna",s:"3×15 por lado",sets:3,w:1,tipo:"ais"},
    {id:"plancha",n:"Core · plancha",s:"3×45 s",sets:3,w:0,tipo:"ais",t:45},
    {id:"elev_piernas_A",n:"Core · elevación de piernas",s:"3×15",sets:3,w:0,tipo:"ais"},
    {id:"bici_A",n:"Bicicleta",s:"20 min",sets:1,w:0,tipo:"ais",t:1200,
     h:"Obligatoria los días de pierna. Parte del objetivo de definición sin volumen excesivo."}
  ]},
  upperB:{t:"Upper B",sub:"Tirón, hombro y brazos",mins:75,warm:"upper",ex:[

function buildDay(idx){
  var c=cfg(), plan=c.plan[idx], B=[];
  var pf=phaseOf("pelv"), mf=phaseOf("mio");

  /* despertar */
  var wake=[{id:"metrics",n:"Peso y energía al despertar",s:"toca para registrar",dom:"reg",metric:1,
    h:"La energía matutina es tu síntoma principal. Es lo que más debería moverse con el protocolo de vía aérea."}];
  if(pf) PELV[pf].ex.forEach(function(e,i){
    wake.push({id:"pm_"+e.id,n:e.n,s:e.s,t:e.t,h:i===0?e.h:null,dom:"pelvi",pre:"Suelo pélvico"});
  });
  B.push({t:"Al despertar",m:"8 min",dom:"reg",items:wake,h0:6,h1:11});

  /* media mañana */
  if(mf) B.push({t:"Media mañana",m:"10 min",dom:"aire",h0:11,h1:14,
    note:"Tanda 1 de 3. En hueco muerto: coche, ducha, cocinando.",
    items:[{id:"mio1",n:"Miofuncional · tanda 1",s:MIO[mf].lbl,dom:"aire",mio:mf}]});

  if(ENT[plan]){
    var e=ENT[plan], esPierna=(plan==="lowerA"||plan==="lowerB");
    /* calentamiento */
    var wm=WARM[e.warm].map(function(x){ return {id:x.id,n:x.n,s:x.s,h:x.h,t:x.t,dom:"movil"}; });
    B.push({t:"Calentamiento",m:"8 min",dom:"movil",h0:16,h1:22,
      note: esPierna
        ? "No es opcional. Con la rodilla izquierda en observación, las series de aproximación son lo que evita el susto."
        : "Manguito rotador y escápula antes de cualquier press. Con protrusiones C5-C7, entrar en frío es donde aparecen los problemas.",
      items:wm});
    /* activación cervical */
    if(c.cuello) B.push({t:"Activación cervical",m:"4 min",dom:"aire",h0:16,h1:22,
      note:"Activación, no estiramiento. Mejora la posición escapular en press y remo.",
      items:CUELLO_A.map(function(x){ return {id:"ca_"+x.id,n:x.n,s:x.s,h:x.h,t:x.t,dom:"aire"}; })});
    /* sesión */
    B.push({t:e.t,m:e.mins+" min",dom:"fuerza",h0:16,h1:22,session:plan,
      items:e.ex.map(function(x){
        return {id:"ex_"+x.id,exId:x.id,n:x.n,s:x.s,h:x.h,w:x.w,r:x.r,sets:x.sets,tipo:x.tipo,t:x.t,dom:"fuerza"};
      })});
    /* después */
    var post=[];
    if(c.cuello) CUELLO_E.forEach(function(x){ post.push({id:"ce_"+x.id,n:x.n,s:x.s,h:x.h,t:x.t,dom:"aire"}); });
    if(c.mov){
      var set = esPierna ? MOV_ISQ.concat(MOV_CAD) : MOV_ESP.concat(MOV_CAD);
      set.forEach(function(x){ post.push({id:"mp_"+x.id,n:x.n,s:x.s,h:x.h,t:x.t,w:x.w,dom:"movil"}); });
    }
    if(post.length) B.push({t:"Después de entrenar",m:(esPierna?"25 min":"20 min"),dom:"movil",h0:16,h1:23,
      note: esPierna
        ? "Músculo caliente: el mejor momento de la semana para ganar rango en isquios."
        : "Nunca estires en estático antes de entrenar: reduce la producción de fuerza.",
      items:post});
  } else {
    if(c.cuello) B.push({t:"Cuello, sesión completa",m:"10 min",dom:"aire",h0:9,h1:21,
      note:"Sin fatiga previa la calidad del trabajo es mejor que en días de gimnasio.",
      items:CUELLO_A.concat(CUELLO_E).map(function(x){
        return {id:"cf_"+x.id,n:x.n,s:x.s,h:x.h,t:x.t,dom:"aire"}; })});
    if(c.mov && plan==="off"){
      var ms=MOV_CAD.concat(MOV_ISQ,MOV_ESP).map(function(x){
        return {id:"md_"+x.id,n:x.n,s:x.s,h:x.h,t:x.t,w:x.w,dom:"movil"}; });
      if(idx===5) MOV_SPG.forEach(function(x){
        ms.push({id:"ms_"+x.id,n:x.n,s:x.s,h:x.h,t:x.t,dom:"movil"}); });
      B.push({t:"Movilidad, sesión larga",m:(idx===5?"30 min":"20 min"),dom:"movil",h0:9,h1:21,
        note: idx===5?"El sábado incluye el trabajo específico de spagat, su frecuencia es semanal.":"",
        items:ms});
    }
  }

  if(mf) B.push({t:"Tarde",m:"10 min",dom:"aire",h0:15,h1:20,
    items:[{id:"mio2",n:"Miofuncional · tanda 2",s:MIO[mf].lbl,dom:"aire",mio:mf}]});

  var night=[];
  if(mf) night.push({id:"mio3",n:"Miofuncional · tanda 3",s:MIO[mf].lbl,dom:"aire",mio:mf});
  if(pf) PELV[pf].ex.forEach(function(e2){
    night.push({id:"pn_"+e2.id,n:e2.n,s:e2.s,t:e2.t,dom:"pelvi",pre:"Suelo pélvico"}); });
  night.push({id:"lado",n:"Dormir de lado, no boca arriba",s:"lo más importante de la noche",dom:"aire",
    h:"Con colapso faríngeo la postura supina empeora el cierre por gravedad. Pelota de tenis cosida en la espalda del pijama si te giras dormido."});
  night.push({id:"cabecera",n:"Cabecera elevada 10-15 cm",s:"",dom:"aire"});
  night.push({id:"pantallas",n:"Sin móvil antes de dormir",s:"música suave en su lugar",dom:"aire"});
  night.push({id:"sintomas",n:"Registro de la noche",s:"toca para registrar",dom:"reg",night:1,
    h:"Cefalea, ronquido y digestión. Es lo que llevarás a la neumóloga y al digestivo."});
  B.push({t:"Noche",m:"12 min",dom:"aire",h0:21,h1:24,items:night});

  return B;
}

/* La plantilla semanal es fija y se repite siempre. Las marcas, métricas
   y registros se guardan SIEMPRE contra el día real de hoy, sea cual sea
   la pestaña de la plantilla que estés mirando. Así puedes hacer la rutina
   del martes un viernes y queda registrada en el día correcto. */
function curDateKey(){ return today(); }
function st(){ return dayState(curDateKey()); }
function setSt(s){ setDayState(curDateKey(),s); }

/* ============================================================
   5. PROGRESIÓN DE CARGA
   ============================================================ */
function lastEntry(exId){ var l=exLog(exId); return l.length?l[l.length-1]:null; }
function suggest(exId,tipo){
  var e=lastEntry(exId);
  if(!e||!e.kg) return null;
  var kg=parseFloat(String(e.kg).replace(",","."));
  if(isNaN(kg)) return null;
  var step = tipo==="comp" ? 2.5 : 1;
  if(e.rpe==null) return {kg:kg,txt:"repite "+fmt(kg)+" kg y anota el RPE"};
  if(e.rpe<=7) return {kg:kg+step,txt:"sube a "+fmt(kg+step)+" kg"};
  if(e.rpe<=8.5) return {kg:kg,txt:"mantén "+fmt(kg)+" kg y busca una repetición más"};
  return {kg:kg,txt:"repite "+fmt(kg)+" kg, el último fue muy exigente"};
}
function fmt(n){ return (Math.round(n*10)/10).toString().replace(".",","); }

/* ============================================================
   6. RENDER — comunes
   ============================================================ */
function ringHTML(done,tot){
  var pct=tot?done/tot:0, r=23, cir=2*Math.PI*r;
  return '<svg width="54" height="54" viewBox="0 0 54 54">'+
    '<circle cx="27" cy="27" r="'+r+'" fill="none" stroke="var(--card)" stroke-width="5"/>'+
    '<circle cx="27" cy="27" r="'+r+'" fill="none" stroke="var(--fuerza)" stroke-width="5"'+
    ' stroke-linecap="round" stroke-dasharray="'+cir.toFixed(1)+'"'+
    ' stroke-dashoffset="'+(cir*(1-pct)).toFixed(1)+'"/></svg>'+
    '<div class="n">'+done+'/'+tot+'</div>';
}
function countDay(B){
  var s=st(),t=0,d=0;
  B.forEach(function(b){ b.items.forEach(function(i){ t++; if(s[i.id]) d++; }); });
  return {t:t,d:d};
}
function itemHTML(it){
  var s=st(), ok=!!s[it.id];
  var col = DOM[it.dom||"fuerza"].c;
  var h='<div class="it'+(ok?' ok':'')+'">';
  h+='<div class="tx">';
  h+='<div class="nm">'+(it.pre?'<span style="color:'+col+'">'+esc(it.pre)+' · </span>':'')+esc(it.n)+'</div>';
  if(it.s) h+='<div class="sch" style="color:'+col+'">'+esc(it.s)+'</div>';

  if(it.metric){
    var m=metrics()[curDateKey()]||{};
    var parts=[];
    if(m.peso!=null) parts.push(m.peso+" kg");
    if(m.energia!=null) parts.push("energía "+m.energia+"/10");
    if(parts.length) h+='<div class="meta">'+esc(parts.join(" · "))+'</div>';
  }
  if(it.night){
    var m2=metrics()[curDateKey()]||{};
    var p2=[];
    if(m2.cefalea!=null) p2.push("cefalea "+m2.cefalea+"/10");
    if(m2.ronquido!=null) p2.push("ronquido "+m2.ronquido+"/10");
    if(m2.digest!=null) p2.push("digestión "+m2.digest+"/10");
    if(p2.length) h+='<div class="meta">'+esc(p2.join(" · "))+'</div>';
  }
  if(it.w){
    var le=lastEntry(it.exId||it.id);
    if(le) h+='<div class="meta">Última vez: <b style="color:var(--tx)">'+esc(le.kg)+' kg</b>'+
      (le.rpe!=null?' · RPE '+le.rpe:'')+'</div>';
  }
  if(it.h) h+='<div class="hint">'+esc(it.h)+'</div>';
  h+='</div>';
  h+='<button class="chk" aria-pressed="'+(ok?'true':'false')+'" data-chk="'+esc(it.id)+'"'+
     ' aria-label="'+esc(it.n)+'"></button>';
  h+='</div>';
  return h;
}

/* ============================================================
   7. VISTA HOY
   ============================================================ */
function nowHour(){ return new Date().getHours(); }

function viewHoy(){
  var B=buildDay(selDay), c=countDay(B), cf=cfg();
  var isToday = selDay===todayIdx();

  if(openBlk===null){
    openBlk=0;
    if(isToday){
      var hh=nowHour();
      for(var i=0;i<B.length;i++){
        if(B[i].h0!=null && hh>=B[i].h0 && hh<B[i].h1){ openBlk=i; break; }
      }
    }
  }

  var h="";

  if(!isToday){
    h+='<div class="note"><b>Estás viendo la rutina de '+esc(DIAS[selDay].toLowerCase())+'.</b> '+
       'Lo que marques se guarda en el día de hoy, así que puedes hacer esta sesión aunque te hayas '+
       'saltado el orden de la semana.</div>';
  }

  /* registro rápido */
  var m=metrics()[curDateKey()]||{};
  h+='<div class="quick">';
  h+='<button class="qcard" data-open="peso"><div class="ql">Peso</div>'+
     (m.peso!=null?'<div class="qv">'+esc(m.peso)+'</div><div class="qu">kg</div>'
                  :'<div class="qv empty">—</div><div class="qu">anotar</div>')+'</button>';

function seriesOf(field,days){
  var m=metrics(), out=[];
  for(var i=days-1;i>=0;i--){
    var d=new Date(); d.setDate(d.getDate()-i);
    var k=iso(d);
    out.push({d:k, v:(m[k]&&m[k][field]!=null)?parseFloat(m[k][field]):null});
  }
  return out;
}
function lineChart(data,color,unit){
  var pts=data.filter(function(p){ return p.v!=null; });
  if(pts.length<2) return '<div class="empty">Necesitas al menos dos registros para ver la tendencia.</div>';
  var W=300,H=90,P=6;
  var vs=pts.map(function(p){ return p.v; });
  var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  if(mx-mn<0.001){ mx=mn+1; mn=mn-1; }
  var n=data.length;
  function X(i){ return P+(i/(n-1))*(W-2*P); }
  function Y(v){ return H-P-((v-mn)/(mx-mn))*(H-2*P); }
  var d="",started=false,circles="";
  data.forEach(function(p,i){
    if(p.v==null) return;
    d += (started?" L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1);
    started=true;
  });
  var last=null;
  for(var j=data.length-1;j>=0;j--){ if(data[j].v!=null){ last={i:j,v:data[j].v}; break; } }
  if(last) circles='<circle cx="'+X(last.i).toFixed(1)+'" cy="'+Y(last.v).toFixed(1)+
    '" r="3.5" fill="'+color+'"/>';
  var first=vs[0], lastv=vs[vs.length-1], diff=lastv-first;
  var sign=diff>0?"+":"";
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:90px">'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    circles+'</svg>'+
    '<div class="cs" style="margin-top:8px">'+pts.length+' registros · '+
    esc(fmt(mn))+' a '+esc(fmt(mx))+' '+esc(unit)+' · variación '+esc(sign+fmt(diff))+' '+esc(unit)+'</div>';
}
function viewProgreso(){

  tbl+='</div>';

      stopTimer();
      if(navigator.vibrate) try{ navigator.vibrate([200,100,200]); }catch(e){}
      renderAll();
      return;
    }
    var el=document.querySelector(".timer .tv");
    if(el){ el.textContent=Math.floor(timerLeft/60)+":"+pad(timerLeft%60); }
    else renderAll();
  },1000);
  renderAll();
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

function buildExport(){
  var m=metrics(), L=[];
  L.push("SEGUIMIENTO — Daniel Fernández Aguilar");
  L.push("Generado el "+today());
  L.push("");
  var ks=Object.keys(m).sort();
  var last30=ks.filter(function(k){ return daysBetween(k,today())<=30; });

  function stat(field){
    var vs=last30.map(function(k){ return m[k][field]; })
                 .filter(function(v){ return v!=null; }).map(parseFloat);
    if(!vs.length) return null;
    var sum=vs.reduce(function(a,b){ return a+b; },0);
    return {n:vs.length, avg:sum/vs.length, min:Math.min.apply(null,vs), max:Math.max.apply(null,vs),
            first:vs[0], last:vs[vs.length-1]};
  }
  [["energia","Energía al despertar (1-10)"],["cefalea","Cefalea (0-10)"],
   ["ronquido","Ronquido (0-10)"],["digest","Molestia digestiva (0-10)"],
   ["peso","Peso corporal (kg)"]].forEach(function(p){
    var s2=stat(p[0]);
    if(!s2) return;
    L.push(p[1]+": media "+fmt(s2.avg)+" · rango "+fmt(s2.min)+"-"+fmt(s2.max)+
           " · "+s2.n+" registros en 30 días");
  });

  L.push("");
  L.push("ADHERENCIA");
  var d30=0;
  for(var i=0;i<30;i++){
    var d=new Date(); d.setDate(d.getDate()-i);
    var s3=dayState(iso(d)), n=0;
    for(var k2 in s3){ if(s3[k2]===true) n++; }
    if(n>=5) d30++;
  }
  L.push("Días con protocolo cumplido: "+d30+" de los últimos 30 ("+Math.round(d30/30*100)+"%)");

  var pl=painLog().filter(function(p){ return daysBetween(p.d,today())<=90; });
  if(pl.length){
    L.push("");
    L.push("MOLESTIAS (90 días)");
    pl.slice(-12).forEach(function(p){
      L.push("- "+p.d+" · "+p.zona+" · intensidad "+p.int+"/10"+
             (p.ex?" · "+p.ex:"")+(p.nota?" · "+p.nota:""));
    });
  }

  var cargas=[];
  [["sentadilla","Sentadilla"],["pm_convencional","Peso muerto"],["press_banca","Press banca"],
   ["press_mil_manc","Press militar mancuernas"]]
    .forEach(function(p){
      var l=exLog(p[0]);
      if(l.length) cargas.push(p[1]+": "+l[l.length-1].kg+" kg ("+l[l.length-1].d+")");
    });
  if(cargas.length){ L.push(""); L.push("CARGAS ACTUALES"); cargas.forEach(function(x){ L.push("- "+x); }); }

  L.push("");
  L.push("ANTECEDENTES RELEVANTES");
  L.push("- Ronquido confirmado por tercera persona. Colapso faríngeo documentado por otorrino.");
  L.push("- Cirugía previa de tabique y cornetes; persiste mala respiración nasal.");
  L.push("- Poligrafía domiciliaria previa negativa (no descarta apnea leve ni SRVAS).");
  L.push("- Protrusiones cervicales C5-C7. Bruxismo con férula.");
  L.push("- SIBO de metano tratado. H. pylori IgG positivo, en tratamiento erradicador.");
  L.push("- IgE específica positiva a Dermatophagoides pteronyssinus y farinae.");
  return L.join("\n");
}

    esc(JSON.stringify(dump))+'</textarea></div>'+

/* ============================================================
   13. RENDER GENERAL
   ============================================================ */
function renderAll(){
  var B=buildDay(selDay), c=countDay(B);
  var plan=cfg().plan[selDay];
  var label = ENT[plan] ? ENT[plan].t+" · "+ENT[plan].sub
            : (plan==="off" ? "Descanso · movilidad y cuello" : "Libre · mantenimiento");

  document.getElementById("hday").textContent = DIAS[selDay];
  document.getElementById("hsub").textContent =
    (selDay===todayIdx() ? fechaLarga() + " · hoy" : label);
  document.getElementById("ring").innerHTML = ringHTML(c.d,c.t);

  var ds="";
  for(var i=0;i<7;i++){
    ds+='<button data-day="'+i+'" class="'+(i===selDay?"on":"")+(i===todayIdx()?" hoy":"")+'">'+
        CORTO[i]+'</button>';
  }
  document.getElementById("dsel").innerHTML=ds;

  var body = view==="hoy"?viewHoy()
           : view==="prog"?viewProgreso()
           : view==="ajus"?viewAjustes()
           : viewGuia();
  document.getElementById("main").innerHTML=body;

  var tabs=[["hoy","☰","Hoy"],["prog","◔","Progreso"],["ajus","⚙","Ajustes"],["guia","ⓘ","Guía"]];
  document.getElementById("tabs").innerHTML = tabs.map(function(t){
    return '<button data-tab="'+t[0]+'" class="'+(view===t[0]?"on":"")+'">'+
      '<span class="ic">'+t[1]+'</span>'+t[2]+'</button>';
  }).join("");

  var lay="";
  if(sess) lay+=sessionHTML();
  else if(timerId) lay+=timerHTML();
  if(layerEl) lay+=layerEl;
  if(toastId) lay+='<div class="toast"><span style="flex:1">Día reiniciado</span>'+
    '<button data-undo="1">Deshacer</button></div>';
  document.getElementById("layer").innerHTML=lay;
}

/* ============================================================
   14. EVENTOS
   ============================================================ */
function closeModal(){ layerEl=null; renderAll(); }

document.addEventListener("click",function(ev){
  var origin=ev.target;

  /* el fondo oscuro solo cierra si se toca el fondo mismo,
     nunca al escribir o tocar dentro de la hoja */
  if(origin && origin.className==="ov"){ return closeModal(); }

  var t=origin;
  while(t && t!==document.body && !(t.getAttribute && hasData(t))) t=t.parentNode;
  if(!t || t===document.body || !t.getAttribute) return;
  var g=function(a){ return t.getAttribute(a); };
  /* dentro de un modal, ignorar el data-ovclose heredado del contenedor */
  if(g("data-ovclose") && t!==origin) return;

  /* navegación */
  if(g("data-tab")){ view=g("data-tab"); openBlk=null; window.scrollTo(0,0); return renderAll(); }
  if(g("data-day")!==null && g("data-day")!==undefined && g("data-day")!==""){
    selDay=parseInt(g("data-day"),10); openBlk=null; window.scrollTo(0,0); return renderAll(); }
  if(g("data-blk")!==null && g("data-blk")!==undefined && g("data-blk")!==""){
    var b=parseInt(g("data-blk"),10); openBlk = (openBlk===b?-1:b); return renderAll(); }

  /* check */
  if(g("data-chk")){
    var k=g("data-chk"), s=st();
    s[k]=!s[k]; setSt(s);
    var it=findItem(k);
    if(it && s[k] && it.t) startTimer(it.t, it.n);
    return renderAll();
  }

  /* sesión */
  if(g("data-sess")){ openSession(g("data-sess")); return; }
  if(g("data-sclose")){ saveCurrentSet(); sess=null; stopTimer(); return renderAll(); }
  if(g("data-snav")){
    saveCurrentSet();
    var e=ENT[sess.plan], d=parseInt(g("data-snav"),10);
    if(sess.i+d<0){ return; }
    if(sess.i+d>=e.ex.length){ sess=null; stopTimer(); return renderAll(); }
    sess.i+=d; stopTimer(); window.scrollTo(0,0); return renderAll();
  }
  if(g("data-set")){
    var n=parseInt(g("data-set"),10), ex2=ENT[sess.plan].ex[sess.i], s2=st();
    var cur=s2["sets_"+ex2.id]||0;
    s2["sets_"+ex2.id] = (cur===n ? n-1 : n);
    if(s2["sets_"+ex2.id]>=(ex2.sets||1)) s2["ex_"+ex2.id]=true;
    else s2["ex_"+ex2.id]=false;
    setSt(s2);
    if(s2["sets_"+ex2.id]>cur) startTimer(ex2.tipo==="comp"?120:60,"Descanso · "+ex2.n);
    return renderAll();
  }
  if(g("data-rpe")){
    var ex3=ENT[sess.plan].ex[sess.i], s3=st();
    s3["rpe_"+ex3.id]=parseInt(g("data-rpe"),10); setSt(s3);
    return renderAll();
  }

  /* temporizador */
  if(g("data-timer")==="stop"){ stopTimer(); return renderAll(); }
  if(g("data-timer")==="add"){ timerLeft+=30; return renderAll(); }

  /* modales */
  if(g("data-mclose")){ return closeModal(); }
  if(g("data-open")){
    var w=g("data-open");
    if(w==="peso") layerEl=modalPeso();
    else if(w==="energia") layerEl=modalEnergia();
    else if(w==="noche") layerEl=modalNoche();
    else if(w==="pain") layerEl=modalPain(g("data-painex")||"");
    else if(w==="export") layerEl=modalExport();
    else if(w==="backup") layerEl=modalBackup();
    else if(w==="import") layerEl=modalImport();
    return renderAll();
  }
  if(g("data-sc")){
    setMetric(curDateKey(), g("data-sc"), parseInt(g("data-v"),10));
    if(g("data-sc")==="energia") return closeModal();
    return renderAll();
  }
  if(g("data-save")==="peso"){
    var inp=document.getElementById("mv");
    if(inp) setMetric(curDateKey(),"peso",inp.value.trim().replace(".",","));
    return closeModal();
  }
  if(g("data-pint")){
    var all=document.querySelectorAll("[data-pint]");
    for(var z=0;z<all.length;z++) all[z].className="";
    t.className="on";
    return;
  }
  if(g("data-savepain")!==null && g("data-savepain")!==undefined){
    var zo=document.getElementById("pz"), nt=document.getElementById("pn");
    var sel=document.querySelector("[data-pint].on");
    addPain({d:today(), zona:zo?zo.value:"Otra", int:sel?sel.getAttribute("data-pint"):"?",
             ex:g("data-savepain")||"", nota:nt?nt.value.trim():""});
    return closeModal();
  }
  if(g("data-copy")){
    var ta=document.getElementById(g("data-copy"));
    if(ta){
      ta.removeAttribute("readonly"); ta.select();
      try{ document.execCommand("copy"); }catch(e){}
      if(navigator.clipboard) try{ navigator.clipboard.writeText(ta.value); }catch(e){}
      ta.setAttribute("readonly","readonly");
      t.textContent="Copiado";
    }
    return;
  }
  if(g("data-doimport")){
    var ia=document.getElementById("imp");
    if(ia){
      try{
        var obj=JSON.parse(ia.value);
        for(var kk in obj) localStorage.setItem(kk,obj[kk]);
        closeModal(); window.scrollTo(0,0);
      }catch(e){ t.textContent="Texto no válido"; }
    }
    return;
  }

  /* config */
  if(g("data-c")){
    var c2=cfg(), field=g("data-c"), v=parseInt(g("data-v"),10);
    if((field==="pelv"||field==="mio") && v>0 && !c2[field]){
      c2[field==="pelv"?"pelvStart":"mioStart"]=today();
    }
    if((field==="pelv"||field==="mio") && v===0){
      c2[field==="pelv"?"pelvStart":"mioStart"]=null;
    }
    c2[field]=v; setCfg(c2); return renderAll();
  }
  if(g("data-plan")!==null && g("data-plan")!==undefined && g("data-plan")!==""){
    var c3=cfg(); c3.plan[parseInt(g("data-plan"),10)]=g("data-pv"); setCfg(c3);
    openBlk=null; return renderAll();
  }

  /* reset con deshacer */
  if(g("data-reset")){
    undoSnap=JSON.stringify(st());
    setSt({});
    if(toastId) clearTimeout(toastId);
    toastId=setTimeout(function(){ toastId=null; undoSnap=null; renderAll(); },6000);
    return renderAll();
  }
  if(g("data-undo")){
    if(undoSnap){ try{ setSt(JSON.parse(undoSnap)); }catch(e){} }
    if(toastId) clearTimeout(toastId);
    toastId=null; undoSnap=null; return renderAll();
  }
});

function hasData(el){
  var a=el.attributes;
  if(!a) return false;
  for(var i=0;i<a.length;i++) if(a[i].name.indexOf("data-")===0) return true;
  return false;
}
function findItem(id){
  var B=buildDay(selDay), r=null;
  B.forEach(function(b){ b.items.forEach(function(i){ if(i.id===id) r=i; }); });
  return r;
}
function saveCurrentSet(){
  if(!sess) return;
  var ex=ENT[sess.plan].ex[sess.i];
  if(!ex.w) return;
  var inp=document.getElementById("sw");
  var s=st();
  if(inp && inp.value.trim()){
    s["w_ex_"+ex.id]=inp.value.trim();
    setSt(s);
    pushExLog(ex.id,{d:curDateKey(), kg:inp.value.trim().replace(".",","),
                     rpe:(s["rpe_"+ex.id]!=null?s["rpe_"+ex.id]:null)});
  }
}

document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t && t.id==="sw") saveCurrentSet();
});

syncDay();
renderAll();
</script>
