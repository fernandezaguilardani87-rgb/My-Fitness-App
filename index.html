<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrenamiento — Lean Bulk</title>
<style>
  :root{
    --bg:#0F1E30;
    --bg-card:#152840;
    --bg-card-2:#1B3049;
    --accent:#4FA8E8;
    --accent-soft:#2E6FA8;
    --text:#E8F0F8;
    --text-dim:#8FA8C4;
    --border:#233B58;
    --good:#5FC98D;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    padding:0 0 40px 0;
    min-height:100vh;
  }
  header{
    padding:28px 20px 20px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:10;
  }
  header h1{
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.3px;
  }
  header p{
    color:var(--text-dim);
    font-size:13px;
    margin-top:4px;
  }
  .days-nav{
    display:flex;
    gap:8px;
    padding:16px 20px 0;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .days-nav::-webkit-scrollbar{display:none;}
  .day-btn{
    flex:0 0 auto;
    background:var(--bg-card);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:10px 16px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
    transition:all .15s ease;
  }
  .day-btn.active{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:#fff;
  }
  main{padding:20px;}
  .day-title{
    font-size:19px;
    font-weight:700;
    margin-bottom:2px;
  }
  .day-subtitle{
    color:var(--accent);
    font-size:13px;
    font-weight:600;
    margin-bottom:18px;
  }
  .exercise{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .exercise-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
  }
  .exercise-name{
    font-size:15px;
    font-weight:600;
  }
  .exercise-scheme{
    color:var(--text-dim);
    font-size:12.5px;
    margin-top:2px;
  }
  .check{
    width:24px;
    height:24px;
    border-radius:7px;
    border:2px solid var(--border);
    flex:0 0 24px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all .15s ease;
  }
  .check.done{
    background:var(--good);
    border-color:var(--good);
  }
  .check.done::after{
    content:"✓";
    color:#0F1E30;
    font-size:14px;
    font-weight:900;
  }
  .weight-row{
    display:none;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--border);
    align-items:center;
    gap:10px;
  }
  .weight-row.open{display:flex;}
  .weight-row input{
    background:var(--bg-card-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    font-size:14px;
    width:90px;
  }
  .weight-row label{
    font-size:12px;
    color:var(--text-dim);
  }
  .weight-row .ref{
    margin-left:auto;
    font-size:11.5px;
    color:var(--text-dim);
    font-style:italic;
  }
  .section-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--text-dim);
    margin:22px 0 10px;
    font-weight:700;
  }
  .note-card{
    background:var(--bg-card-2);
    border:1px solid var(--accent-soft);
    border-radius:12px;
    padding:14px 16px;
    font-size:13px;
    color:var(--text-dim);
    line-height:1.5;
    margin-top:6px;
  }
  .note-card b{color:var(--text);}
  .progress-bar{
    height:6px;
    background:var(--bg-card);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .cardio-badge{
    display:inline-block;
    background:var(--accent-soft);
    color:#fff;
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:20px;
    margin-top:10px;
  }
  .reset-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--text-dim);
    font-size:12px;
    padding:8px 14px;
    border-radius:8px;
    margin-top:20px;
    cursor:pointer;
    width:100%;
  }
</style>
</head>
<body>

<header>
  <h1>Lean Bulk — 74 → 80kg</h1>
  <p>Upper/Lower · 5 días · Mes 2</p>
</header>

<div class="days-nav" id="daysNav"></div>

<main>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="day-title" id="dayTitle"></div>
  <div class="day-subtitle" id="daySubtitle"></div>
  <div id="exerciseList"></div>
  <button class="reset-btn" id="resetBtn">Reiniciar checklist del día</button>
</main>

<script>
const DATA = {
  "Lunes": {
    subtitle: "Upper A · Fuerza + Empuje",
    exercises: [
      {name:"Press banca plano", scheme:"4×6-8", ref:""},
      {name:"Press militar barra", scheme:"4×6-8", ref:""},
      {name:"Press inclinado mancuernas", scheme:"3×8-10", ref:""},
      {name:"Elevaciones laterales mancuernas", scheme:"4×15-20", ref:""},
      {name:"Elevaciones laterales polea baja", scheme:"3×15-20", ref:""},
      {name:"Tríceps polea cuerda", scheme:"3×15-20", ref:""},
      {name:"Tríceps sobre cabeza", scheme:"3×12-15", ref:""},
      {name:"Face pulls", scheme:"3×15-20", ref:""}
    ]
  },
  "Martes": {
    subtitle: "Lower A · Cuádriceps",
    exercises: [
      {name:"Sentadilla con barra", scheme:"4×6-8", ref:"Sem.1: 60kg"},
      {name:"Prensa", scheme:"3×12-15", ref:""},
      {name:"Extensión cuádriceps", scheme:"3×15-20", ref:""},
      {name:"Curl femoral tumbado", scheme:"4×15-20", ref:""},
      {name:"Elevación talones de pie", scheme:"3×20", ref:""},
      {name:"Core: crunch con peso", scheme:"3 series", ref:""},
      {name:"Core: crunch lateral mancuerna", scheme:"3 series", ref:""},
      {name:"Core: plancha", scheme:"3 series", ref:""},
      {name:"Core: elevación piernas", scheme:"3 series", ref:""}
    ],
    cardio:"Bicicleta 20 min"
  },
  "Miércoles": {
    subtitle: "Upper B · Tirón + Hombro + Brazos",
    exercises: [
      {name:"Dominadas / jalón", scheme:"4×6-8", ref:""},
      {name:"Remo barra", scheme:"4×6-8", ref:""},
      {name:"Remo polea baja", scheme:"3×15-20", ref:""},
      {name:"Elevaciones laterales mancuernas", scheme:"4×15-20", ref:""},
      {name:"Pájaro mancuernas", scheme:"3×15-20", ref:""},
      {name:"Curl bíceps barra", scheme:"4×15-20", ref:""},
      {name:"Curl predicador / polea", scheme:"3×12-15", ref:""},
      {name:"Curl martillo", scheme:"3×12-15", ref:""},
      {name:"Face pulls", scheme:"4×15-20", ref:""}
    ]
  },
  "Jueves": {
    subtitle: "Lower B · Isquiotibial",
    exercises: [
      {name:"Peso muerto convencional", scheme:"4×5-6", ref:"Sem.1: 110kg"},
      {name:"Peso muerto rumano", scheme:"3×8-10", ref:"Sem.1: 70kg, exc. lenta"},
      {name:"Curl femoral sentado", scheme:"4×15-20", ref:""},
      {name:"Hip thrust con carga", scheme:"3×12-15", ref:""},
      {name:"Elevación talones sentado", scheme:"4×20", ref:""},
      {name:"Core: elevación piernas", scheme:"3 series", ref:""},
      {name:"Core: ab rueda", scheme:"3 series", ref:""},
      {name:"Core: dead bug", scheme:"3 series", ref:""}
    ],
    cardio:"Bicicleta 20 min"
  },
  "Viernes": {
    subtitle: "Upper C · Hombro + Brazos + Complemento",
    exercises: [
      {name:"Press militar mancuernas", scheme:"4×8-10", ref:"Sem.1: 22.5kg/mano"},
      {name:"Elevaciones laterales mancuernas", scheme:"5×15-20", ref:""},
      {name:"Elevaciones laterales polea baja", scheme:"3×15-20", ref:""},
      {name:"Pájaro mancuernas", scheme:"3×15-20", ref:""},
      {name:"Fondos paralelas", scheme:"3×8-10", ref:""},
      {name:"Press banca agarre cerrado", scheme:"3×8-10", ref:""},
      {name:"Curl bíceps barra", scheme:"3×15-20", ref:""},
      {name:"Curl martillo", scheme:"3×12-15", ref:""},
      {name:"Face pulls", scheme:"4×15-20", ref:""}
    ]
  },
  "Cuello": {
    subtitle: "Cervical · Postura · Diario",
    exercises: [
      {name:"Chin tucks (retracción cervical)", scheme:"3×10-12, 3seg", ref:""},
      {name:"Isométricos de cuello (4 direcciones)", scheme:"3×5-8seg c/u", ref:""},
      {name:"Estiramiento suboccipital", scheme:"2-3×30seg", ref:""},
      {name:"Estiramiento trapecio superior", scheme:"30seg/lado", ref:""},
      {name:"Estiramiento elevador escápula", scheme:"30seg/lado", ref:""},
      {name:"Movilidad torácica (foam roller)", scheme:"2 min", ref:""}
    ]
  }
};

const DAYS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Cuello"];
let currentDay = DAYS[0];

// Detectar día actual real si coincide con lunes-viernes
const today = new Date().getDay(); // 0=domingo,1=lunes...
const map = {1:"Lunes",2:"Martes",3:"Miércoles",4:"Jueves",5:"Viernes"};
if(map[today]) currentDay = map[today];

function loadChecklist(day){
  const raw = localStorage.getItem('checklist_'+day+'_'+todayKey());
  return raw ? JSON.parse(raw) : {};
}
function saveChecklist(day, data){
  localStorage.setItem('checklist_'+day+'_'+todayKey(), JSON.stringify(data));
}
function todayKey(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function renderNav(){
  const nav = document.getElementById('daysNav');
  nav.innerHTML = '';
  DAYS.forEach(day=>{
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (day===currentDay ? ' active' : '');
    btn.textContent = day;
    btn.onclick = ()=>{ currentDay = day; render(); };
    nav.appendChild(btn);
  });
}

function render(){
  renderNav();
  const dayData = DATA[currentDay];
  document.getElementById('dayTitle').textContent = currentDay;
  document.getElementById('daySubtitle').textContent = dayData.subtitle;

  const checklist = loadChecklist(currentDay);
  const list = document.getElementById('exerciseList');
  list.innerHTML = '';

  dayData.exercises.forEach((ex, i)=>{
    const isDone = !!checklist[i];
    const weightVal = checklist['w'+i] || '';

    const card = document.createElement('div');
    card.className = 'exercise';
    card.innerHTML = `
      <div class="exercise-head" data-idx="${i}">
        <div>
          <div class="exercise-name">${ex.name}</div>
          <div class="exercise-scheme">${ex.scheme}</div>
        </div>
        <div class="check ${isDone?'done':''}" data-check="${i}"></div>
      </div>
      <div class="weight-row ${isDone?'open':''}" data-weightrow="${i}">
        <label>Peso usado</label>
        <input type="text" inputmode="decimal" placeholder="kg" value="${weightVal}" data-weightinput="${i}">
        ${ex.ref ? `<span class="ref">${ex.ref}</span>` : ''}
      </div>
    `;
    list.appendChild(card);
  });

  if(dayData.cardio){
    const badge = document.createElement('div');
    badge.className = 'cardio-badge';
    badge.textContent = '🚴 ' + dayData.cardio;
    list.appendChild(badge);
  }

  // notas específicas
  const noteDiv = document.createElement('div');
  noteDiv.className = 'note-card';
  if(currentDay==="Cuello"){
    noteDiv.innerHTML = '<b>Rutina diaria</b> — chin tucks y estiramientos suboccipitales idealmente todos los días (5-10 min). El resto, 3-4 veces por semana. Objetivo: recuperar curvatura cervical y reducir dolor de cabeza tensional referido desde la nuca. Precaución: protrusiones C5-C7 — evitar flexión cervical forzada bajo carga.';
  } else if(currentDay==="Lunes" || currentDay==="Miércoles" || currentDay==="Viernes"){
    noteDiv.innerHTML = '<b>Postura:</b> face pulls obligatorios. Estiramientos pectorales y retracción escapular al terminar.';
  } else {
    noteDiv.innerHTML = '<b>Piernas:</b> objetivo definición sin volumen excesivo. Cardio 20 min obligatorio.';
  }
  list.appendChild(noteDiv);

  updateProgress(dayData, checklist);
  attachHandlers(dayData);
}

function updateProgress(dayData, checklist){
  const total = dayData.exercises.length;
  let done = 0;
  for(let i=0;i<total;i++){ if(checklist[i]) done++; }
  const pct = total ? (done/total*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function attachHandlers(dayData){
  document.querySelectorAll('[data-check]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const idx = el.getAttribute('data-check');
      const checklist = loadChecklist(currentDay);
      checklist[idx] = !checklist[idx];
      saveChecklist(currentDay, checklist);
      render();
    };
  });
  document.querySelectorAll('.exercise-head').forEach(el=>{
    el.onclick = ()=>{
      const idx = el.getAttribute('data-idx');
      const row = document.querySelector(`[data-weightrow="${idx}"]`);
      row.classList.toggle('open');
    };
  });
  document.querySelectorAll('[data-weightinput]').forEach(el=>{
    el.onchange = ()=>{
      const idx = el.getAttribute('data-weightinput');
      const checklist = loadChecklist(currentDay);
      checklist['w'+idx] = el.value;
      saveChecklist(currentDay, checklist);
    };
  });
}

document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('¿Reiniciar el checklist de hoy para este día?')){
    saveChecklist(currentDay, {});
    render();
  }
};

render();
</script>

</body>
</html>
